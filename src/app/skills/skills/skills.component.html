<!-- Title Section -->
<div id="skills" class="h4 text-center mb-4 title" style="margin-top: 100px; font-family: 'Gilroy'; color: black; font-size: 50px;">
  Skills
</div>

<!-- Skills Section -->
<div class="skills" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;">
  <div
    class="skill card"
    *ngFor="let skill of skills"
    style="width: calc(50% - 20px); margin-bottom: 20px; text-align: center;"
  >
    <!-- Circle Progress Component -->
    <circle-progress
      [percent]="skill.percentage"
      [radius]="50"
      [outerStrokeWidth]="16"
      [innerStrokeWidth]="8"
      [outerStrokeColor]="getOuterStrokeColor()"
      [innerStrokeColor]="getInnerStrokeColor()"
      [animation]="true"
      [animationDuration]="300"
    ></circle-progress>

    <!-- Skill Details -->
    <div class="skill-details" style="margin-top: 10px;">
      <div class="skill-name" style="font-size: 16px; font-weight: bold;">
        {{ skill.skillName }}
      </div>
    </div>
  </div>
</div>
